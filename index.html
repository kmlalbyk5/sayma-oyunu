<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sol - Sağ - Alkış Sayma Oyunu</title>
<style>
:root{--bg:#fff7e0;--card:#ffffff;--text:#2b2b3a;--muted:#6b6b80;--l:#3b82f6;--r:#f97316;--c:#22c55e;--btn:#7c3aed;--btntext:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b2b;--card:#26263a;--text:#f2f2fa;--muted:#a5a5c0}}
:root[data-theme="dark"]{--bg:#1b1b2b;--card:#26263a;--text:#f2f2fa;--muted:#a5a5c0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:640px;text-align:center}
h1{font-size:clamp(1.3rem,4.5vw,2rem);margin:8px 0}
.rules{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.rules span{background:var(--card);border-radius:12px;padding:6px 12px;font-weight:bold;font-size:clamp(.9rem,3vw,1.1rem)}
.stage{background:var(--card);border-radius:28px;padding:20px 12px;box-shadow:0 6px 0 rgba(0,0,0,.12);border:6px solid var(--muted);transition:border-color .2s}
.stage.sol{border-color:var(--l)}.stage.sag{border-color:var(--r)}.stage.alkis{border-color:var(--c)}
.num{font-size:clamp(5rem,28vw,10rem);font-weight:900;line-height:1}
.sol .num{color:var(--l)}.sag .num{color:var(--r)}.alkis .num{color:var(--c)}
.icon{font-size:clamp(4rem,20vw,7rem);height:1.3em;line-height:1.3;display:inline-block}
.sol .icon{animation:toL .5s}.sag .icon{animation:toR .5s}.alkis .icon{animation:clap .5s}
@keyframes toL{0%{transform:translateX(60px)}100%{transform:translateX(0)}}
@keyframes toR{0%{transform:translateX(-60px)}100%{transform:translateX(0)}}
@keyframes clap{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.word{font-size:clamp(1.6rem,7vw,2.6rem);font-weight:bold;min-height:1.3em}
.bar{height:14px;background:var(--bg);border-radius:8px;margin:14px 6px 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--btn);transition:width .3s}
.ctrl{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{font:inherit;font-weight:bold;font-size:clamp(1rem,4vw,1.3rem);border:0;border-radius:16px;padding:12px 22px;background:var(--btn);color:var(--btntext);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button.alt{background:var(--card);color:var(--text)}
button.sel{outline:4px solid var(--c)}
.speed{margin-top:14px;color:var(--muted);font-weight:bold}
.speed .ctrl{margin-top:6px}
.done .num{font-size:clamp(3rem,14vw,5rem)}
</style>
</head>
<body>
<main>
<h1>👋 Sol - Sağ - Alkış! 👏</h1>
<div class="rules"><span style="color:var(--l)">1 → Eller sola</span><span style="color:var(--r)">2 → Eller sağa</span><span style="color:var(--c)">3 → Alkış</span></div>
<div class="stage" id="stage">
<div class="icon" id="icon">🙌</div>
<div class="num" id="num">Hazır mısın?</div>
<div class="word" id="word">Başlat'a bas!</div>
<div class="bar"><i id="fill"></i></div>
</div>
<div class="ctrl">
<button id="go">▶ Başlat</button>
<button class="alt" id="reset">↺ Baştan</button>
</div>
<div class="speed">Hız
<div class="ctrl">
<button class="alt" data-ms="2000">🐢 Yavaş</button>
<button class="alt sel" data-ms="1100">🙂 Normal</button>
<button class="alt" data-ms="800">🐇 Hızlı</button>
</div></div>
<p style="color:var(--muted);font-size:.9rem">Boşluk (space) tuşu başlatır / durdurur.</p>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),icon=document.getElementById('icon'),num=document.getElementById('num'),word=document.getElementById('word'),fill=document.getElementById('fill'),go=document.getElementById('go');
var n=0,ms=1100,timer=null,ac=null;
var acts={1:{c:'sol',i:'👈',w:'Eller SOLA'},2:{c:'sag',i:'👉',w:'Eller SAĞA'},0:{c:'alkis',i:'👏',w:'ALKIŞ!'}};
function beep(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);o.stop(ac.currentTime+.3)}catch(e){}}
function show(){
var a=acts[n%3];
stage.className='stage '+a.c;
icon.textContent=a.i;num.textContent=n;word.textContent=a.w;
fill.style.width=n+'%';
icon.style.animation='none';void icon.offsetWidth;icon.style.animation='';
beep(n%3==1?330:n%3==2?392:523);
}
function tick(){
if(n>=100){finish();return}
n++;show();
if(n>=100){clearInterval(timer);timer=null;setTimeout(finish,ms)}
}
function finish(){
clearInterval(timer);timer=null;
stage.className='stage alkis done';
icon.textContent='🎉🏆🎉';num.textContent='Tebrikler!';word.textContent='100\'e kadar saydık!';
go.textContent='▶ Tekrar oyna';n=100;
}
function start(){
if(n>=100){n=0}
go.textContent='⏸ Durdur';
tick();timer=setInterval(tick,ms);
}
function pause(){clearInterval(timer);timer=null;go.textContent='▶ Devam';}
function toggle(){timer?pause():start()}
go.onclick=toggle;
document.getElementById('reset').onclick=function(){
clearInterval(timer);timer=null;n=0;stage.className='stage';icon.textContent='🙌';num.textContent='Hazır mısın?';word.textContent='Başlat\'a bas!';fill.style.width='0';go.textContent='▶ Başlat';
};
document.querySelectorAll('[data-ms]').forEach(function(b){
b.onclick=function(){
ms=+b.dataset.ms;
document.querySelectorAll('[data-ms]').forEach(function(x){x.classList.remove('sel')});
b.classList.add('sel');
if(timer){clearInterval(timer);timer=setInterval(tick,ms)}
};
});
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();toggle()}});
})();
</script>
</body>
</html>
